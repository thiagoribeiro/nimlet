name: Nimlet Landing / GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/verify_site.py'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/verify_site.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nimlet-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate links, assets, and metadata
        run: python3 .github/scripts/verify_site.py
      - name: Validate JavaScript syntax
        run: node --check site/app.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
