version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - bodyclose
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Deferred Close errors on readers and connections carry no actionable information.
      - linters: [errcheck]
        source: "^\\s*defer .*\\.Close\\(\\)"
