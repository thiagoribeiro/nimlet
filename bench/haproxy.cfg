# Load balancer for bench/cluster.sh. Eight pre-declared slots start in maintenance;
# cluster.sh enables, drains and disables them through the runtime API (127.0.0.1:19999),
# so adding or removing an instance never reloads HAProxy.
global
	maxconn 60000
	stats socket ipv4@127.0.0.1:19999 level admin
	stats timeout 5s

defaults
	mode http
	timeout connect 2s
	# Longer than the 30s /sync long-poll the loadgen asks for.
	timeout client 90s
	timeout server 90s
	timeout http-keep-alive 60s
	# A request whose connection to an instance fails is retried on another one. Only
	# connection failures are retried, so a send that reached an instance is never replayed
	# by the LB; the loadgen retries those itself with the same txnId.
	retries 2
	option redispatch 1

frontend api
	bind 127.0.0.1:18080
	default_backend nimlet

backend nimlet
	balance hdr(Authorization)
	hash-type consistent
	default-server check inter 1s fall 2 rise 1 maxconn 20000
	server n1 127.0.0.1:18081 disabled
	server n2 127.0.0.1:18082 disabled
	server n3 127.0.0.1:18083 disabled
	server n4 127.0.0.1:18084 disabled
	server n5 127.0.0.1:18085 disabled
	server n6 127.0.0.1:18086 disabled
	server n7 127.0.0.1:18087 disabled
	server n8 127.0.0.1:18088 disabled
